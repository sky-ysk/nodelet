apiVersion: v1
kind: Pod
metadata:
  name: python
spec:
  containers:
  - name: resource-monitor  # 容器名称
    image: python:3.10-slim  # 镜像名称及版本
    imagePullPolicy: Never  # 关键配置，确保使用本地镜像
    command: ["ls", "-a"]  # 执行挂载的脚本
    workingDir: /data  # 设置工作目录
    volumeMounts:
    - name: script-volume
      mountPath: /data  # 挂载到容器的 /data 目录
  volumes:
  - name: script-volume
    hostPath:
      path: /home/public/workspace/heongtong_yolo_linux  # 宿主机上的实际路径
      type: Directory  # 确保目录存在
  restartPolicy: Never  # 任务完成后不重启